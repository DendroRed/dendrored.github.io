<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DendroRed</title>
  <meta name="description" content="Catálogo colaborativo de sitios y cronologías dendrocronológicas de Chile.">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bitter:wght@500;600;700&display=swap">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="css/estilos.css?v=0.4">
</head>
<body>
  <a class="saltar" href="#contenido">Ir al contenido</a>

  <header class="barra">
    <a class="marca" href="#mapa" aria-label="DendroRed, ir al mapa">
      <img src="img/logo.svg" alt="" width="30" height="30">
      <span>DendroRed</span>
    </a>
    <nav id="nav" aria-label="Secciones"></nav>
  </header>

  <main id="contenido">
    <!-- El mapa se mantiene vivo entre vistas para no perder el encuadre -->
    <section id="vista-mapa" hidden></section>
    <section id="vista" hidden></section>
  </main>

  <div id="avisos" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/proj4@2.12.1/dist/proj4.js"></script>
  <!-- El ?v= obliga al navegador a bajar los archivos de nuevo. GitHub Pages
       los sirve con cache-control de 10 minutos y una pestaña abierta puede
       conservarlos mucho más, así que sin esto una página vieja sigue
       hablándole a una base ya migrada. SUBE EL NÚMERO con cada migración
       (0.4 → 0.5); el número no significa nada por sí mismo, solo tiene que
       cambiar. -->
  <script src="js/config.js?v=0.4"></script>
  <script src="js/coordenadas.js?v=0.4"></script>
  <script src="js/importador.js?v=0.4"></script>
  <script src="js/app.js?v=0.4"></script>
</body>
</html>
